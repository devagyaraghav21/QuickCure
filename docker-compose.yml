services:

  backend:
    image: devagya/quickcure-backend:latest
    container_name: quickcure-backend-compose
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    restart: unless-stopped

  frontend:
    image: devagya/quickcure-frontend:latest
    container_name: quickcure-frontend-compose
    expose:
      - "80"
    restart: unless-stopped

  # nginx:
  #   image: nginx:alpine
  #   container_name: quickcure-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   restart: unless-stopped

  kong:
    image: kong/kong-gateway:3.16.0.0
    container_name: quickcure-kong

    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml

      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr

      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      KONG_ADMIN_LISTEN: 0.0.0.0:8001

    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro

    ports:
      - "80:8000"
      - "8001:8001"

    depends_on:
      - backend
      - frontend

    restart: unless-stopped