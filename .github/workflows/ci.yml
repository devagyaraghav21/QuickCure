name: QuickCure CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v6


      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Create frontend .env
      - name: Create frontend .env
        run: |
          echo "VITE_BACKEND_URL=" > frontend/.env
  
          

      # 3. Create backend .env
      - name: Create backend .env
        run: |
          cat > backend/.env << EOF
          PORT=4000
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          EOF


      # 4. Build Docker images
      - name: Build Docker Compose services
        run: docker compose build


      # 5. Start application
      - name: Start QuickCure
        run: docker compose up -d


      # 6. Show running containers
      - name: Check running containers
        run: docker compose ps


      # 7. Wait for application
      - name: Wait for QuickCure
        run: |
          echo "Waiting for QuickCure to start..."

          for i in {1..30}; do

            if curl -f http://localhost/ > /dev/null 2>&1 && \
               curl -f http://localhost/health > /dev/null 2>&1; then

              echo "Frontend and Backend are ready!"
              exit 0

            fi

            echo "Waiting... attempt $i/30"
            sleep 2

          done

          echo "QuickCure did not become ready."

          docker compose ps
          docker compose logs

          exit 1


      # 8. Test frontend
      - name: Test frontend
        run: |
          echo "Testing frontend..."

          curl -f http://localhost/

          echo "Frontend test passed!"


      # 9. Test backend
      - name: Test backend
        run: |
          echo "Testing backend..."

          curl -f http://localhost/health

          echo "Backend test passed!"


      # 10. Show logs if something failed
      - name: Show container logs
        if: failure()
        run: docker compose logs


      # 11. Clean up containers
      - name: Clean up test environment
        if: always()
        run: docker compose down