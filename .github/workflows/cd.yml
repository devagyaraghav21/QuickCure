name: QuickCure CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # 1. Get the latest code
      - name: Checkout code
        uses: actions/checkout@v6


      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # 3. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # 4. Build and push Backend
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quickcure-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quickcure-backend:${{ github.sha }}


      # 5. Build and push Frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quickcure-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quickcure-frontend:${{ github.sha }}


      # 6. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            cd ~/QuickCure 

            echo "Pulling latest Docker images..."

            docker compose pull

            echo "Restarting QuickCure..."

            docker compose up -d

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "Deployment completed!"

            docker compose ps